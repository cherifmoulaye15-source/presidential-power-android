name: Build PRESIDENTIAL POWER Android APK V75.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V75.0 project
        run: |
          unzip -q PRESIDENTIAL_POWER_V75_0_ANDROID.zip -d extracted
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/PRESIDENTIAL_POWER_V75_0_ANDROID" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/www/index.html"
          test -f "$PROJECT_DIR/capacitor.config.json"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Synchronize Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRESIDENTIAL-POWER-V75.0-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
