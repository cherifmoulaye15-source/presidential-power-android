
name: Build PRESIDENTIAL POWER Android APK V75.0 TEST

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V75.0 TEST project
        run: |
          unzip -q PRESIDENTIAL_POWER_V75_0_ANDROID_TEST.zip -d extracted

      - name: Locate project
        run: |
          PACKAGE_JSON=$(find extracted -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERREUR : package.json introuvable"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet trouvé : $PROJECT_DIR"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Verify application configuration
        run: |
          cd "$PROJECT_DIR"
          test -f package.json
          test -f www/index.html
          test -f capacitor.config.json
          grep -q 'com.presidentialpower.game.v750test' capacitor.config.json

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Synchronize Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRESIDENTIAL-POWER-V75.0-TEST-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
